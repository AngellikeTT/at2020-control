name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Release: the real-time stress tests measure the engine, not debug-build overhead.
      - name: Test
        run: cargo test --release --workspace

      - name: Loom (lock-free ring and meters)
        run: cargo test --release -p core-dsp --lib --target x86_64-pc-windows-msvc --config "target.x86_64-pc-windows-msvc.rustflags=['--cfg','loom']" -- loom

      - name: Build release
        run: cargo build --release --workspace
        env:
          AT2020_BUILD_ID: ${{ github.sha }}

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package (portable exe, zip, installer)
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
          ./scripts/package.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: at2020-control-windows
          path: dist/*

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
