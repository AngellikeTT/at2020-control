[package]
name = "at2020-control"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Control panel and real-time voice processing chain for the Audio-Technica AT2020USB-X"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
cpal = "0.15"
nnnoiseless = "0.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
