[package]
name = "core-dsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Platform-neutral DSP: parameters, filters, dynamics, RNNoise wrapper, resampler, spectrum, offline processing"

[dependencies]
anyhow.workspace = true
serde.workspace = true
nnnoiseless.workspace = true
realfft.workspace = true
hound.workspace = true

# Model checking of the lock-free code (src/sync.rs, src/ring.rs); see src/sync.rs.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
