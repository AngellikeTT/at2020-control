[workspace]
resolver = "2"
members = ["crates/core-dsp", "crates/device", "crates/app", "crates/probe"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Control panel and real-time voice processing chain for the Audio-Technica AT2020USB-X"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
hound = "3.5.1"
realfft = "3.5.0"
nnnoiseless = "0.5"
cpal = "0.15"
triple_buffer = "8.1.1"
tracing = "0.1"
core-dsp = { path = "crates/core-dsp" }
device = { path = "crates/device" }

[workspace.dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell_PropertiesSystem",
]

[workspace.dependencies.windows-core]
version = "0.58"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwind (not abort) so every Drop guard runs on a panic: exclusive streams are stopped
# and released, COM is uninitialised, and journaled device state is restored.
panic = "unwind"
